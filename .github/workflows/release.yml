name: Release

# Al subir una etiqueta `vX.Y.Z` compila el juego, lo empaqueta con sus recursos y publica la versión.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    # Ubuntu 22.04 para enlazar con una glibc antigua y que el binario corra en más distribuciones.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libopenmpt-dev pkg-config libudev-dev
      - run: cargo build --release -p cb-game
      - name: Empaquetar
        run: |
          name="clanbomber-rs-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/clanbomber-rs "$name/"
          cp -r assets "$name/assets"
          cp LICENSE README.md "$name/"
          strip "$name/clanbomber-rs"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
          generate_release_notes: true
          body: |
            ## Cómo jugar / How to play

            ```bash
            tar xzf ${{ env.ASSET }}
            cd clanbomber-rs-*
            ./clanbomber-rs
            ```

            Necesita en el sistema / Needs on the system: `libasound2`, `libopenmpt0`, `libudev1`
            (`sudo apt install libasound2 libopenmpt0 libudev1`) y una GPU con Vulkan.
