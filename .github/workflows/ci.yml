name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Linux necesita las cabeceras de ALSA (sonido, vía rodio/cpal) y de libudev (mandos, vía gilrs).
  # Windows y macOS no necesitan nada más.
  APT_DEPS: libasound2-dev libudev-dev pkg-config

jobs:
  fmt:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo test --workspace

  build:
    name: Compilación release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [fmt, clippy, test]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo build --release -p cb-game
