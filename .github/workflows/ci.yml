name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Las dependencias del sistema que necesitan el sonido (rodio/cpal), la música (.mod) y los mandos.
  APT_DEPS: libasound2-dev libopenmpt-dev pkg-config libudev-dev

jobs:
  fmt:
    name: Formato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo test --workspace

  build:
    name: Compilación release
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias del sistema
        run: sudo apt-get update && sudo apt-get install -y $APT_DEPS
      - run: cargo build --release --workspace
